version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comitiva_user
      POSTGRES_PASSWORD: comitiva_password
      POSTGRES_DB: comitiva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comitiva_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://comitiva_user:comitiva_password@postgres:5432/comitiva
      JWT_SECRET: dev_secret_key_change_in_production
      NODE_ENV: development
      PORT: 3000
      PAYMENT_GATEWAY: mercadopago
      FOLLOWUP_CHECK_INTERVAL_MINUTOS: 5
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app/server
      - ./uploads:/app/uploads

volumes:
  postgres_data:
