<body><main><h1>Você está sem conexão.</h1><p>O aplicativo continua instalado, mas contratos, pagamentos, reservas e dados da conta precisam de internet para permanecerem seguros e atualizados.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
